name: Release

on:
  push:
    tags: ["v*"]
  # Lets the release pipeline be exercised without cutting a release — useful
  # after bumping the actions it depends on, which CI does not otherwise cover.
  workflow_dispatch:

# No blanket write token: only `publish` may touch the release, and only
# `build` may sign for provenance.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: herdr-worktree-setup

jobs:
  verify:
    name: tag matches manifests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          tag=${GITHUB_REF_NAME#v}
          cargo_v=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          plugin_v=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' herdr-plugin.toml | head -n1)
          echo "tag=$tag cargo=$cargo_v plugin=$plugin_v"
          test "$tag" = "$cargo_v" && test "$tag" = "$plugin_v"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    # `verify` is skipped on a manual run; a skipped dependency must not skip
    # the build, but a failed one must.
    if: always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Keyless Sigstore signing for build provenance.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          asset="$BIN-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" "$BIN"
          sha256sum "$asset" > "$asset.sha256"
      - name: attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ env.BIN }}-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.BIN }}-${{ matrix.target }}.tar.gz
            ${{ env.BIN }}-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: publish release
    needs: build
    # Only a tag publishes. A manual run stops after build + attest.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist && cat *.sha256 | sort -k2 > SHA256SUMS && rm *.sha256 && cat SHA256SUMS
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          # An explicit asset list: a compromised matrix leg cannot smuggle
          # extra files into a published release.
          cd dist
          for t in aarch64-apple-darwin x86_64-apple-darwin \
                   x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            gh release upload "$GITHUB_REF_NAME" "herdr-worktree-setup-$t.tar.gz" --clobber
          done
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
